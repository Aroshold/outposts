<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outpost Control Display</title>
    <style>
		root: {
			--color-bg: #f5f5f0;
		}
		.cyber: {
			--color-bg: linear-gradient(135deg, #1a0033 0%, #330066 100%);
		}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
			max-height: 10px;
			transition: 0.4s ease-in-out;
            padding: 15px 20px;
			opacity: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
		.header:hover {
			opacity: 1;
			max-height: 100px
		}

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #00aa00;
        }

        .status-dot {
            width: 8px;3133342
            height: 8px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #00ff00;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .view-selector {
            display: flex;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .container:hover .view-selector {
            opacity: 1;
            pointer-events: all;
        }

        .view-btn {
            padding: 8px 16px;
            border: 2px solid #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            cursor: pointer;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .view-btn.active {
            background: #00d4ff;
            color: #0a0a0a;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.6);
        }

        .view-btn:hover {
            border-color: #00ffff;
        }

        .display-area {
            flex: 1;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Newspaper View */
		.newspaper-item.primary {
		    background: rgba(255, 215, 0, 0.1);
		    border-left: 3px solid #ffd700;
		    padding-left: 12px;
		}
		header.newspaper-mode {
			background: linear-gradient(to right, #f5f5f5, #e8e8e8);
			color: #1a1a1a;
			border-bottom: 2px solid #333;
		}
		.newspaper-item.primary .newspaper-item-name {
		    color: #ffd700;
		    font-weight: bold;
		}
        .newspaper-view {
            width: 100%;
            height: 100%;
            background: #f5f5f0;
            color: #333;
            padding: 30px;
            overflow-y: auto;
            font-family: 'Georgia', serif;
            display: none;
        }

        .newspaper-view.active {
            display: block;
        }

        .newspaper-header {
            text-align: center;
            border-bottom: 3px solid #333;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .newspaper-title {
            font-size: 48px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 5px;
        }

        .newspaper-subtitle {
            font-size: 14px;
            font-style: italic;
            color: #666;
        }

        .newspaper-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .newspaper-section {
            border: 2px solid #333;
            padding: 15px;
        }

        .newspaper-section-title {
            font-size: 20px;
            font-weight: bold;
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .newspaper-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .newspaper-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px dotted #999;
        }

        .newspaper-item-name {
            font-weight: bold;
            flex: 1;
        }

        .newspaper-status {
            font-size: 12px;
            text-transform: uppercase;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 3px;
        }

        .status-classic {
            background: #ffd700;
            color: #000;
        }

        .status-cyberpunk {
            background: #a020f0;
            color: #fff;
        }

        /* Broadcast View */
		.broadcast-card.primary {
		    border-width: 3px;
		    box-shadow: 0 0 25px rgba(255, 255, 0, 0.6), 0 0 15px currentColor;
		}
		header.broadcast-mode {
			background: linear-gradient(to right, #0a0e27, #0f3460);
			color: #00ff88;
			border-bottom: 2px solid #00ff88;
		}
		.broadcast-primary-star {
		    position: absolute;
		    top: 5px;
		    right: 10px;
		    font-size: 20px;
		    animation: twinkle 1s infinite;
		}
		
		@keyframes twinkle {
		    0%, 100% { opacity: 1; }
		    50% { opacity: 0.5; }
		}
       .broadcast-view {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0033 0%, #330066 100%);
            color: #00ff00;
            padding: 30px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            display: none;
            position: relative;
        }

        .broadcast-view.active {
            display: block;
        }

        .broadcast-view::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(
                    0deg,
                    rgba(0, 255, 0, 0.03) 0px,
                    rgba(0, 255, 0, 0.03) 1px,
                    transparent 1px,
                    transparent 2px
                );
            pointer-events: none;
            animation: scanlines 8s linear infinite;
        }

        @keyframes scanlines {
            0% { transform: translateY(0); }
            100% { transform: translateY(10px); }
        }

        .broadcast-content {
            position: relative;
            z-index: 1;
        }

        .broadcast-header {
            text-align: center;
            border-bottom: 3px double #00ff00;
            padding-bottom: 15px;
            margin-bottom: 20px;
            position: relative;
        }

        .broadcast-title {
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00ff00;
            margin-bottom: 5px;
        }

        .broadcast-time {
            font-size: 11px;
            color: #00aa00;
            text-align: right;
        }

        .broadcast-counter {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 11px;
            color: #00aa00;
            opacity: 0.7;
        }

        .broadcast-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .broadcast-card {
            border: 2px solid #00ff00;
            padding: 15px;
            background: rgba(0, 255, 0, 0.05);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
            min-height: 100px;
            display: flex;
            flex-direction: column;
        }

        .broadcast-card.cyberpunk {
            border-color: #ff00ff;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.4);
            color: #ff00ff;
            background: rgba(255, 0, 255, 0.05);
        }

        .broadcast-card.classic {
            border-color: #ffff00;
            box-shadow: 0 0 15px rgba(255, 255, 0, 0.4);
            color: #ffff00;
            background: rgba(255, 255, 0, 0.05);
        }

        .broadcast-card-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            border-bottom: 1px solid currentColor;
            padding-bottom: 5px;
        }

        .broadcast-card-content {
            font-size: 11px;
            line-height: 1.6;
            flex: 1;
        }

        .broadcast-card-content strong {
            color: inherit;
        }

        .connection-info {
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 10px;
            color: #00aa00;
            opacity: 0.6;
            z-index: 2;
        }

        .scrollbar-custom::-webkit-scrollbar {
            width: 10px;
        }

        .scrollbar-custom::-webkit-scrollbar-track {
            background: rgba(0, 212, 255, 0.1);
        }

        .scrollbar-custom::-webkit-scrollbar-thumb {
            background: #00d4ff;
            border-radius: 5px;
        }

        .scrollbar-custom::-webkit-scrollbar-thumb:hover {
            background: #00ffff;
        }

        .newspaper-view {
            scrollbar-color: #00d4ff rgba(0, 212, 255, 0.1);
        }

        .broadcast-view {
            scrollbar-color: #00ff00 rgba(0, 255, 0, 0.1);
        }

        @media (max-width: 1024px) {
            .newspaper-grid {
                grid-template-columns: 1fr;
            }

            .broadcast-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .broadcast-grid {
                grid-template-columns: 1fr;
            }

            .newspaper-view, .broadcast-view {
                padding: 15px;
            }

            .newspaper-title {
                font-size: 32px;
            }

            .broadcast-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div style="flex: 1;">
                <div class="connection-status">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">Подключение...</span>
                </div>
            </div>

            <div class="view-selector">
                <button class="view-btn active" data-view="newspaper">📰 Классики</button>
                <button class="view-btn" data-view="broadcast">📺 Киберпанки</button>
            </div>

            <div style="flex: 1; text-align: right; font-size: 12px; color: #00aa00;">
                <span id="outpostCount">0</span> Аванпосты • 
                <span id="classicCount">0</span>🏛️ • 
                <span id="cyberpunkCount">0</span>⚡
            </div>
        </div>

        <!-- Display Area -->
        <div class="display-area scrollbar-custom">
            <!-- Newspaper View -->
            <div class="newspaper-view active" id="newspaperView">
                <div class="newspaper-header">
                    <div class="newspaper-title">ПОБЕДНЫЕ ВЕДОМОСТИ</div>
                    <div class="newspaper-subtitle">Официальные отчеты о контроллируемых территориях</div>
                </div>
                <div class="newspaper-grid">
                    <div>
                        <div class="newspaper-section">
                            <div class="newspaper-section-title">🏛️ Владения классиков</div>
                            <div class="newspaper-items" id="classicOutposts"></div>
                        </div>
                    </div>
                    <div>
                        <div class="newspaper-section">
                            <div class="newspaper-section-title">⚡ Владения киберпанков</div>
                            <div class="newspaper-items" id="cyberpunkOutposts"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Broadcast View -->
            <div class="broadcast-view" id="broadcastView">
                <div class="broadcast-content">
                    <div class="broadcast-header">
                        <div class="broadcast-counter" id="broadcastTime">[00000]</div>
                        <div class="broadcast-title">AROSHOLD MEDIA</div>
                        <div class="broadcast-time">Репортажи о состоянии аванпостов • Прямой эфир</div>
                    </div>
                    <div class="broadcast-grid" id="broadcastGrid"></div>
                    <div class="connection-info" id="connectionInfo">СИГНАЛ: АКТИВЕН</div>
                </div>
            </div>
        </div>
    </div>

    <script>

        const API_BASE_URL = 'https://outposts.vercel.app';
        const WS_URL = 'wss://outposts.vercel.app';

        class OutpostAPI {
            constructor() {
                this.ws = null;
                this.reconnectAttempts = 0;
                this.maxReconnectAttempts = 5;
                this.outposts = [];
            }

            async getOutposts() {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/outposts`);
                    if (!response.ok) throw new Error('Failed to load outposts');
                    const data = await response.json();
                    this.outposts = data;
                    return data;
                } catch (error) {
                    console.error('❌ Error loading outposts:', error);
                    throw error;
                }
            }

            connectWebSocket(onMessage, onClose) {
                return new Promise((resolve, reject) => {
                    try {
                        this.ws = new WebSocket(`${WS_URL}/ws/display`);
                        
                        this.ws.onopen = () => {
                            console.log('✅ WebSocket connected');
                            this.reconnectAttempts = 0;
                            updateConnectionStatus(true);
                            resolve();
                        };
                        
                        this.ws.onmessage = (event) => {
                            const data = JSON.parse(event.data);
                            console.log('📨 Update received:', data);
                            if (onMessage) onMessage(data);
                        };
                        
                        this.ws.onerror = (error) => {
                            console.error('❌ WebSocket error:', error);
                            updateConnectionStatus(false);
                            reject(error);
                        };
                        
                        this.ws.onclose = () => {
                            console.log('❌ WebSocket disconnected');
                            updateConnectionStatus(false);
                            if (onClose) onClose();
                            this.attemptReconnect(onMessage, onClose);
                        };
                    } catch (error) {
                        reject(error);
                    }
                });
            }

            attemptReconnect(onMessage, onClose) {
                if (this.reconnectAttempts < this.maxReconnectAttempts) {
                    this.reconnectAttempts++;
                    const delay = Math.min(1000 * Math.pow(2, this.reconnectAttempts), 30000);
                    console.log(`🔄 Reconnecting in ${delay}ms...`);
                    
                    setTimeout(() => {
                        this.connectWebSocket(onMessage, onClose)
                            .catch(err => console.error('Reconnection error:', err));
                    }, delay);
                }
            }

            disconnectWebSocket() {
                if (this.ws) {
                    this.ws.close();
                    this.ws = null;
                }
            }
        }

        // ============================================================================
        // UI MANAGEMENT
        // ============================================================================

        const api = new OutpostAPI();
        let allOutposts = [];
        let broadcastCounter = 0;
        let currentView = 'newspaper';

        function updateConnectionStatus(connected) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            if (connected) {
                statusDot.classList.add('connected');
                statusText.textContent = 'Connected';
                statusText.style.color = '#00ff00';
            } else {
                statusDot.classList.remove('connected');
                statusText.textContent = 'Reconnecting...';
                statusText.style.color = '#ff4444';
            }
        }

        function updateStats() {
            const classicCount = allOutposts.filter(o => o.team === 'classic').length;
            const cyberpunkCount = allOutposts.filter(o => o.team === 'cyberpunk').length;
            
            document.getElementById('outpostCount').textContent = allOutposts.length;
            document.getElementById('classicCount').textContent = classicCount;
            document.getElementById('cyberpunkCount').textContent = cyberpunkCount;
        }

		function renderNewspaperView() {
    		const classicList = document.getElementById('classicOutposts');
    		const cyberpunkList = document.getElementById('cyberpunkOutposts');

    		const classicOutposts = allOutposts.filter(o => o.team === 'classic');
			const cyberpunkOutposts = allOutposts.filter(o => o.team === 'cyberpunk');
			classicList.innerHTML = classicOutposts.length > 0 
        		? classicOutposts.map(o => `
            		<div class="newspaper-item ${o.is_primary ? 'primary' : ''}">
                		<span class="newspaper-item-name">${o.is_primary ? '⭐ ' : ''}${o.name}</span>
                		<span class="newspaper-status status-classic">ЗАХВАЧЕН</span>
		            </div>
		        `).join('')
		        : '<div class="newspaper-item"><span style="color: #999;">No holdings</span></div>';
		
		    cyberpunkList.innerHTML = cyberpunkOutposts.length > 0
		        ? cyberpunkOutposts.map(o => `
		            <div class="newspaper-item ${o.is_primary ? 'primary' : ''}">
		                <span class="newspaper-item-name">${o.is_primary ? '⭐ ' : ''}${o.name}</span>
		                <span class="newspaper-status status-cyberpunk">ЗАХВАЧЕН</span>
		            </div>
		        `).join('')
		        : '<div class="newspaper-item"><span style="color: #999;">No holdings</span></div>';
		
		    updateStats();
		}

		function renderBroadcastView() {
		    const grid = document.getElementById('broadcastGrid');
		    grid.innerHTML = allOutposts.map(o => `
		        <div class="broadcast-card ${o.team} ${o.is_primary ? 'primary' : ''}">
		            ${o.is_primary ? '<div class="broadcast-primary-star">⭐</div>' : ''}
		            <div class="broadcast-card-title">${o.name}</div>
		            <div class="broadcast-card-content">
		                СТАТУС: <strong>${o.team === 'classic' ? 'КОНТРОЛЬ КЛАССИКОВ' : 'СЕТЬ КИБЕРПАНКОВ'}</strong>
		                <br>СИГНАЛ: АКТИВЕН
		                <br>ЧАСТОТА: ${(Math.random() * 100).toFixed(1)} GHz
		                <br>ID: [${String(o.id).padStart(3, '0')}]
		                ${o.is_primary ? '<br><span style="color: #ffff00; font-weight: bold;">ГЛАВНЫЙ</span>' : ''}
		            </div>
		        </div>
		    `).join('');
		
		    updateStats();
		}

        function startBroadcastCounter() {
            setInterval(() => {
                broadcastCounter++;
                const time = document.getElementById('broadcastTime');
                if (time) {
                    time.textContent = `[${String(broadcastCounter).padStart(5, '0')}]`;
                }
            }, 500);
        }

        // ============================================================================
        // VIEW SWITCHING
        // ============================================================================

        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const view = this.dataset.view;
                
                // Update buttons
                document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                // Update views
                const newspaperView = document.getElementById('newspaperView');
                const broadcastView = document.getElementById('broadcastView');

                if (view === 'newspaper') {
                    newspaperView.classList.add('active');
                    broadcastView.classList.remove('active');
                } else {
                    newspaperView.classList.remove('active');
                    broadcastView.classList.add('active');
                }
                
                currentView = view;
            });
        });

        // ============================================================================
        // INITIALIZATION
        // ============================================================================

        window.addEventListener('load', async () => {
            try {
                // Load initial outposts
                console.log('📦 Loading outposts...');
                const outposts = await api.getOutposts();
                allOutposts = outposts;
                renderNewspaperView();
                renderBroadcastView();
                startBroadcastCounter();

                // Connect to WebSocket
                console.log('🔌 Connecting to WebSocket...');
                await api.connectWebSocket(
                    (data) => {
                        if (data.type === 'outpost_updated') {
                            console.log('🎯 Outpost updated:', data.outpost);
                            const index = allOutposts.findIndex(o => o.id === data.outpost.id);
                            if (index !== -1) {
                                allOutposts[index] = data.outpost;
                            }
                            renderNewspaperView();
                            renderBroadcastView();
                        } else if (data.type === 'initial_state') {
                            allOutposts = data.outposts;
                            renderNewspaperView();
                            renderBroadcastView();
                        }
                    }
                );

            } catch (error) {
                console.error('❌ Fatal error:', error);
                updateConnectionStatus(false);
            }
        });

        // Cleanup on unload
        window.addEventListener('beforeunload', () => {
            api.disconnectWebSocket();
        });
    </script>
</body>
</html>
